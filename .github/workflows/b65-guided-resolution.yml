name: B6-5 Guided Resolution Gate

on:
  push:
    branches:
      - feature/v011-beta6-b65-guided-resolution
      - stable/v011-beta6-b65
  pull_request:
    paths:
      - 'sentinel/home_smart_scan_ui.py'
      - 'sentinel/home_threat_cards_ui.py'
      - 'sentinel/home_guided_resolution.py'
      - 'sentinel/home_guided_resolution_ui.py'
      - 'sentinel/home_guided_resolution_window.py'
      - 'sentinel/ui_quality_refinement.py'
      - 'sentinel/ui_motion_components.py'
      - 'sentinel/guided_resolution_provider_loader.py'
      - 'sentinel/guided_resolution_live_provider.py'
      - 'sentinel/guided_resolution_action_plan.py'
      - 'tests/test_v011_beta6_b650_*.py'
      - 'tests/test_v011_beta6_b651_*.py'
      - 'tests/test_v011_beta6_b652_*.py'
      - 'tests/test_v011_beta6_ui_quality_refinement.py'
      - '.github/workflows/b65-guided-resolution.yml'
  workflow_dispatch:

jobs:
  guided-resolution:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      BC_SENTINEL_REDUCED_MOTION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile B6-5.2 plus UI quality and predecessors
        shell: pwsh
        run: |
          python -m compileall -q sentinel/home_security_model.py sentinel/home_security_ui.py sentinel/home_smart_scan.py sentinel/home_smart_scan_ui.py sentinel/home_smart_scan_window.py sentinel/home_threat_cards.py sentinel/home_threat_cards_ui.py sentinel/home_threat_cards_window.py sentinel/home_guided_resolution.py sentinel/home_guided_resolution_ui.py sentinel/ui_quality_refinement.py sentinel/ui_motion_components.py sentinel/guided_resolution_provider_loader.py sentinel/guided_resolution_live_provider.py sentinel/guided_resolution_action_plan.py sentinel/home_guided_resolution_window.py tests/test_v011_beta6_b650_guided_resolution.py tests/test_v011_beta6_b650_window.py tests/test_v011_beta6_b651_provider_loader.py tests/test_v011_beta6_b652_action_plan.py tests/test_v011_beta6_ui_quality_refinement.py
      - name: B6-0 through B6-5.2 deterministic regression suite
        shell: pwsh
        run: |
          python -m pytest -q tests/test_v011_beta6_b60_technician_ux_foundation.py tests/test_v011_beta6_b61_unified_home_target_discovery.py tests/test_v011_beta6_b61_home_real_ui_regressions.py tests/test_v011_beta6_b62_home_security_overview.py tests/test_v011_beta6_b62_visual_consistency_refinement.py tests/test_v011_beta6_b63_smart_scan.py tests/test_v011_beta6_b63_smart_scan_ui.py tests/test_v011_beta6_b63_live_provider_loader.py tests/test_v011_beta6_b63_live_runtime_adapter.py tests/test_v011_beta6_b63_runtime_compat.py tests/test_v011_beta6_b634_smart_scope.py tests/test_v011_beta6_b635_live_ui_probe.py tests/test_v011_beta6_b64_threat_cards.py tests/test_v011_beta6_b64_window.py tests/test_v011_beta6_b650_guided_resolution.py tests/test_v011_beta6_b650_window.py tests/test_v011_beta6_b651_provider_loader.py tests/test_v011_beta6_b652_action_plan.py tests/test_v011_beta6_ui_quality_refinement.py
      - name: B6-3 predecessor acceptance
        shell: pwsh
        run: python -m tools.v011_beta6_b63_acceptance --output acceptance-v011-beta6-b63-b65-ci.json
      - name: Passive B6-4 predecessor self-check
        shell: pwsh
        run: python -m sentinel.home_threat_cards_window --self-check
      - name: Passive B6-5.2 planning + UI quality self-check
        shell: pwsh
        run: python -m sentinel.home_guided_resolution_window --self-check
      - name: B6-5.2 Qt offscreen smoke
        shell: pwsh
        run: python -m sentinel.home_guided_resolution_window --offscreen-smoke