name: B12-1 Process File Correlation 2.0

on:
  push:
    branches:
      - feature/v012-beta12-b121-process-file-correlation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Beta12 B12-1 full regression and correlation acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V012-BETA12-B121.ps1 -ConfirmProcessFileCorrelation
