name: B14-6 Isolated Lab Readiness

on:
  push:
    branches:
      - feature/v014-b146-isolated-lab-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-lab-readiness:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: B14-6 full regression and isolated lab readiness acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V014-B146-ISOLATED-LAB-READINESS.ps1 -ConfirmIsolatedLabReadiness
