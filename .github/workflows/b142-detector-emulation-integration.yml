name: B14-2 Detector Emulation Integration

on:
  push:
    branches:
      - feature/v014-b142-detector-emulation-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detector-emulation-integration:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: B14-2 full regression and detector/emulation integration acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V014-B142-DETECTOR-EMULATION-INTEGRATION.ps1 -ConfirmDetectorEmulationIntegration
