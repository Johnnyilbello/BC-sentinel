name: B7-0 Coverage Ledger Gate

on:
  push:
    branches:
      - feature/v011-beta7-b70-coverage-ledger
  pull_request:
    paths:
      - 'coverage/attack_coverage_ledger.json'
      - 'sentinel/coverage_ledger.py'
      - 'tests/test_v011_beta7_b70_coverage_ledger.py'
      - 'BC_Sentinel_Roadmap_v0_11_0_Beta7.md'
      - '.github/workflows/b70-coverage-ledger.yml'
  workflow_dispatch:

jobs:
  coverage-ledger:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      BC_SENTINEL_REDUCED_MOTION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile B7-0
        shell: pwsh
        run: |
          python -m compileall -q sentinel/coverage_ledger.py tests/test_v011_beta7_b70_coverage_ledger.py
      - name: Beta5 + Beta6 predecessor regression and B7-0 tests
        shell: pwsh
        run: |
          $tests = @(
            Get-ChildItem -Path "tests/test_v011_beta5_*.py","tests/test_v011_beta6_*.py","tests/test_v011_beta7_b70_coverage_ledger.py" |
              Sort-Object FullName |
              ForEach-Object { $_.FullName }
          )
          python -m pytest -q @tests
      - name: Coverage ledger self-check
        shell: pwsh
        run: |
          python -m sentinel.coverage_ledger --self-check
