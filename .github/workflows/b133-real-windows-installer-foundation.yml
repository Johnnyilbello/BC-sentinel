name: B13-3 Real Windows Installer Foundation

on:
  push:
    branches:
      - feature/v013-b133-real-windows-installer-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Beta13 B13-3 full regression and real installer lifecycle acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V013-B133-REAL-INSTALLER.ps1 -ConfirmRealInstaller
