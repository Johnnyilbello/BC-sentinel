name: B9-0 Windows Telemetry Foundation
on:
  push:
    branches: [feature/v011-beta9-b90-telemetry-foundation]
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Full regression and live Windows inventory
        shell: powershell
        run: ./tools/acceptance/TEST-V011-BETA9-B90.ps1 -ConfirmTelemetryFoundationAcceptance
