name: B7-4 Attack-Chain Acceptance Harness

on:
  push:
    branches:
      - feature/v011-beta7-b74-attack-chain-harness
  pull_request:
    paths:
      - 'sentinel/attack_chain_harness.py'
      - 'tests/test_v011_beta7_b74_attack_chain_harness.py'
      - 'TEST-V011-BETA7-B74.ps1'
      - 'BC_Sentinel_Roadmap_v0_11_0_Beta7.md'
      - 'BC_SENTINEL_V011_BETA7_B74_IMPLEMENTATION_STATUS.md'
      - '.github/workflows/b74-attack-chain-harness.yml'
  workflow_dispatch:

jobs:
  attack-chain-harness:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      BC_SENTINEL_REDUCED_MOTION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile B7-4
        shell: pwsh
        run: |
          python -m compileall -q sentinel/coverage_ledger.py sentinel/security_graph.py sentinel/incident_correlation.py sentinel/confidence_gate.py sentinel/attack_chain_harness.py tests/test_v011_beta7_b70_coverage_ledger.py tests/test_v011_beta7_b71_security_graph.py tests/test_v011_beta7_b72_incident_correlation.py tests/test_v011_beta7_b73_confidence_gate.py tests/test_v011_beta7_b74_attack_chain_harness.py
      - name: Beta5 + Beta6 + B7-0/B7-1/B7-2/B7-3 predecessor regression and B7-4 tests
        shell: pwsh
        run: |
          $tests = @(
            Get-ChildItem -Path "tests/test_v011_beta5_*.py","tests/test_v011_beta6_*.py","tests/test_v011_beta7_b70_coverage_ledger.py","tests/test_v011_beta7_b71_security_graph.py","tests/test_v011_beta7_b72_incident_correlation.py","tests/test_v011_beta7_b73_confidence_gate.py","tests/test_v011_beta7_b74_attack_chain_harness.py" |
              Sort-Object FullName |
              ForEach-Object { $_.FullName }
          )
          python -m pytest -q @tests
      - name: B7-0 coverage ledger predecessor self-check
        shell: pwsh
        run: python -m sentinel.coverage_ledger --self-check
      - name: B7-1 Security Graph predecessor self-check
        shell: pwsh
        run: python -m sentinel.security_graph --self-check
      - name: B7-2 Incident Correlation predecessor self-check
        shell: pwsh
        run: python -m sentinel.incident_correlation --self-check
      - name: B7-3 Confidence Gate predecessor self-check
        shell: pwsh
        run: python -m sentinel.confidence_gate --self-check
      - name: B7-4 Attack-Chain Harness self-check
        shell: pwsh
        run: python -m sentinel.attack_chain_harness --self-check
      - name: B7-4 safety assertions
        shell: pwsh
        run: |
          python -c "from sentinel.attack_chain_harness import self_check,EXPECTED_STAGE_ORDER; r=self_check(); assert r['passed']; assert r['stage_order']==list(EXPECTED_STAGE_ORDER); assert r['case_outcomes']['b74-case-recommend']=='RECOMMEND'; assert r['case_outcomes']['b74-case-review']=='REVIEW_REQUIRED'; assert r['case_outcomes']['b74-case-blocked']=='BLOCKED_INSUFFICIENT_EVIDENCE'; assert r['stable_round_trip']; assert r['deterministic_serialization']; assert r['source_graph_unchanged']; assert r['source_correlation_unchanged']; assert r['process_execution'] is False; assert r['file_write'] is False; assert r['network_io'] is False; assert r['registry_mutation'] is False; assert r['remediation_execution'] is False; assert r['authority_granted'] is False"
