name: B14-0 Verified Protection Test Readiness

on:
  push:
    branches:
      - feature/v014-b140-verified-protection-test-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-readiness:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: B14-0 full regression and test-readiness acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V014-B140-TEST-READINESS.ps1 -ConfirmTestReadinessFoundation
