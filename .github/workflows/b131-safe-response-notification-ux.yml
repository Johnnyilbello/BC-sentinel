name: B13-1 Safe Response Notification UX

on:
  push:
    branches:
      - feature/v013-b131-safe-response-notification-ux
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Beta13 B13-1 full regression and safe-response acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V013-B131-SAFE-RESPONSE.ps1 -ConfirmSafeResponseNotifications
