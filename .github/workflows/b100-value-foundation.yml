name: B10-0 Value Foundation and Competitive Contract
on:
  push:
    branches: [feature/v011-beta10-b100-value-foundation]
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Full regression and Beta10 value-foundation acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V011-BETA10-B100.ps1 -ConfirmBeta10ValueFoundation
