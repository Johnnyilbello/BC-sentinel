name: B8-2 Defense-Evasion / Tamper Detector Gate

on:
  push:
    branches:
      - feature/v011-beta8-b82-defense-evasion-tamper
  pull_request:
    paths:
      - 'sentinel/defense_evasion_detector.py'
      - 'tests/test_v011_beta8_b82_defense_evasion_detector.py'
      - 'tools/acceptance/TEST-V011-BETA8-B82.ps1'
      - 'ROADMAP.md'
      - '.github/workflows/b82-defense-evasion-tamper.yml'
  workflow_dispatch:

jobs:
  b82-defense-evasion-tamper:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      BC_SENTINEL_REDUCED_MOTION: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run B8-2 exact acceptance gate
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\tools\acceptance\TEST-V011-BETA8-B82.ps1" -ConfirmDefenseEvasionAcceptance
