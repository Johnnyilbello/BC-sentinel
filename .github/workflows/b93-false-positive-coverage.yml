name: B9-3 False-Positive Controls and Coverage Decisions
on:
  push:
    branches: [feature/v011-beta9-b93-false-positive-coverage]
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Full regression and live false-positive coverage acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V011-BETA9-B93.ps1 -ConfirmFalsePositiveCoverageAcceptance
