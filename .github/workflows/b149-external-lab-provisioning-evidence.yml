name: B14-9 External Lab Provisioning Evidence

on:
  push:
    branches:
      - feature/v014-b149-external-lab-provisioning-evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-lab-provisioning-evidence:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: B14-9 full regression and external lab provisioning evidence acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V014-B149-EXTERNAL-LAB-PROVISIONING.ps1 -ConfirmExternalLabProvisioningEvidence
