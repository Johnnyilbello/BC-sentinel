name: B14-7 T2 Static Real-Sample Evidence

on:
  push:
    branches:
      - feature/v014-b147-t2-static-real-sample-evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t2-static-real-sample-evidence:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: B14-7 full regression and T2 static evidence acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V014-B147-T2-STATIC-EVIDENCE.ps1 -ConfirmT2StaticEvidence
