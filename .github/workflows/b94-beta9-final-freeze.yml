name: B9-4 Beta9 Windows Final Acceptance and Freeze
on:
  push:
    branches: [feature/v011-beta9-b94-windows-freeze]
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Full Beta9 Windows acceptance and freeze gate
        shell: powershell
        run: ./tools/acceptance/TEST-V011-BETA9-B94.ps1 -ConfirmBeta9FinalAcceptance
