name: B14-8 T3 Isolated Dynamic Evidence

on:
  push:
    branches:
      - feature/v014-b148-t3-isolated-dynamic-evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t3-isolated-dynamic-evidence:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: B14-8 full regression and T3 isolated dynamic evidence acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V014-B148-T3-DYNAMIC-EVIDENCE.ps1 -ConfirmT3DynamicEvidence
