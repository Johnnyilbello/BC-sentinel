name: B14-10 Real Host Preflight

on:
  push:
    branches:
      - feature/v014-b1410-real-host-preflight
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-host-preflight:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: B14-10 full regression and real-host preflight acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V014-B1410-REAL-HOST-PREFLIGHT.ps1 -ConfirmRealHostPreflight
