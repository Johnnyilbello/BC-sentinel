name: B10-6 Reversible Response Pilot

on:
  push:
    branches:
      - feature/v011-beta10-b106-reversible-response-pilot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Full regression and B10-6 reversible response acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V011-BETA10-B106.ps1 -ConfirmReversibleResponsePilot
