name: B10-3 Live Coverage Expansion I

on:
  push:
    branches:
      - feature/v011-beta10-b103-live-coverage-expansion-i
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Full regression and B10-3 live PowerShell acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V011-BETA10-B103.ps1 -ConfirmLiveCoverageExpansion
