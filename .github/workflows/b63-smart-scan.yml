name: B6-3 Smart Scan Gate

on:
  push:
    branches:
      - feature/v011-beta6-b63-smart-scan
  pull_request:
    paths:
      - 'sentinel/home_smart_scan.py'
      - 'sentinel/home_smart_scan_ui.py'
      - 'sentinel/home_smart_scan_window.py'
      - 'sentinel/smart_scan_provider_loader.py'
      - 'tests/test_v011_beta6_b63_*.py'
      - 'tools/v011_beta6_b63_acceptance.py'
      - 'TEST-V011-BETA6-B63.ps1'
      - '.github/workflows/b63-smart-scan.yml'
  workflow_dispatch:

jobs:
  smart-scan:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      BC_SENTINEL_REDUCED_MOTION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile B6-3 and predecessor Home modules
        shell: pwsh
        run: |
          python -m compileall -q sentinel/home_security_model.py sentinel/home_security_ui.py sentinel/home_smart_scan.py sentinel/home_smart_scan_ui.py sentinel/home_smart_scan_window.py sentinel/smart_scan_provider_loader.py tools/v011_beta6_b62_acceptance.py tools/v011_beta6_b63_acceptance.py tests/test_v011_beta6_b63_smart_scan.py tests/test_v011_beta6_b63_smart_scan_ui.py tests/test_v011_beta6_b63_live_provider_loader.py
      - name: B6-0 through B6-3 deterministic regression suite
        shell: pwsh
        run: |
          python -m pytest -q tests/test_v011_beta6_b60_technician_ux_foundation.py tests/test_v011_beta6_b61_unified_home_target_discovery.py tests/test_v011_beta6_b61_home_real_ui_regressions.py tests/test_v011_beta6_b62_home_security_overview.py tests/test_v011_beta6_b62_visual_consistency_refinement.py tests/test_v011_beta6_b63_smart_scan.py tests/test_v011_beta6_b63_smart_scan_ui.py tests/test_v011_beta6_b63_live_provider_loader.py
      - name: B6-2 predecessor deterministic acceptance
        shell: pwsh
        run: python -m tools.v011_beta6_b62_acceptance --output acceptance-v011-beta6-b62-b63-ci.json
      - name: B6-3 deterministic acceptance
        shell: pwsh
        run: python -m tools.v011_beta6_b63_acceptance --output acceptance-v011-beta6-b63-ci.json
      - name: Passive B6-3 self-check
        shell: pwsh
        run: python -m sentinel.home_smart_scan_window --self-check
      - name: B6-3 Qt offscreen smoke
        shell: pwsh
        run: python -m sentinel.home_smart_scan_window --offscreen-smoke
