name: B14-4 Lab Test Orchestrator

on:
  push:
    branches:
      - feature/v014-b144-lab-test-orchestrator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab-test-orchestrator:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: B14-4 full regression and lab test orchestrator acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V014-B144-LAB-TEST-ORCHESTRATOR.ps1 -ConfirmLabTestOrchestrator
