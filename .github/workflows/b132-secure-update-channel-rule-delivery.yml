name: B13-2 Secure Update Channel Rule Delivery

on:
  push:
    branches:
      - feature/v013-b132-secure-update-channel-rule-delivery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Beta13 B13-2 full regression and secure-update acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V013-B132-SECURE-UPDATES.ps1 -ConfirmSecureUpdates
