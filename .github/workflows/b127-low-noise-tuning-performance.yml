name: B12-7 Low-Noise Tuning Performance

on:
  push:
    branches:
      - feature/v012-beta12-b127-low-noise-tuning-performance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Beta12 B12-7 full regression and low-noise performance acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V012-BETA12-B127.ps1 -ConfirmLowNoisePerformance
