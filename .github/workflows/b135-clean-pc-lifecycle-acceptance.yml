name: B13-5 Clean-PC Install Upgrade Uninstall Acceptance

on:
  push:
    branches:
      - feature/v013-b135-clean-pc-install-upgrade-uninstall-acceptance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-pc-lifecycle-acceptance:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: B13-5 full regression and real clean-PC lifecycle acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V013-B135-CLEAN-PC-LIFECYCLE.ps1 -ConfirmCleanPcLifecycleAcceptance
