name: v0.14 T1 input hardening

on:
  push:
    branches:
      - hardening/v014-t1-variants
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-acceptance:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run T1 input hardening acceptance
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\acceptance\TEST-V014-T1-INPUT-HARDENING.ps1

      - name: All applicable candidate tests (historical contracts archived separately)
        shell: powershell
        run: |
          $testBase = Join-Path $env:TEMP ('BCSentinel-candidate-' + [guid]::NewGuid().ToString('N'))
          python -m pytest -q --basetemp $testBase --junitxml=candidate-junit.xml -o faulthandler_timeout=60
          if ($LASTEXITCODE -ne 0) { throw 'Applicable candidate regression failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-regression-${{ github.sha }}
          path: candidate-junit.xml
