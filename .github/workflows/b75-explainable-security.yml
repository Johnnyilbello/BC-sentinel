name: B7-5 Explainable Security

on:
  push:
    branches:
      - feature/v011-beta7-b75-explainable-security
  pull_request:
    paths:
      - 'sentinel/explainable_security.py'
      - 'tests/test_v011_beta7_b75_explainable_security.py'
      - 'TEST-V011-BETA7-B75.ps1'
      - 'BC_Sentinel_Roadmap_v0_11_0_Beta7.md'
      - '.github/workflows/b75-explainable-security.yml'
  workflow_dispatch:

jobs:
  explainable-security:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      BC_SENTINEL_REDUCED_MOTION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile B7-5
        shell: pwsh
        run: |
          python -m compileall -q sentinel/coverage_ledger.py sentinel/security_graph.py sentinel/incident_correlation.py sentinel/confidence_gate.py sentinel/attack_chain_harness.py sentinel/explainable_security.py tests/test_v011_beta7_b70_coverage_ledger.py tests/test_v011_beta7_b71_security_graph.py tests/test_v011_beta7_b72_incident_correlation.py tests/test_v011_beta7_b73_confidence_gate.py tests/test_v011_beta7_b74_attack_chain_harness.py tests/test_v011_beta7_b75_explainable_security.py
      - name: Beta5 + Beta6 + B7-0/B7-1/B7-2/B7-3/B7-4 predecessor regression and B7-5 tests
        shell: pwsh
        run: |
          $tests = @(
            Get-ChildItem -Path "tests/test_v011_beta5_*.py","tests/test_v011_beta6_*.py","tests/test_v011_beta7_b70_coverage_ledger.py","tests/test_v011_beta7_b71_security_graph.py","tests/test_v011_beta7_b72_incident_correlation.py","tests/test_v011_beta7_b73_confidence_gate.py","tests/test_v011_beta7_b74_attack_chain_harness.py","tests/test_v011_beta7_b75_explainable_security.py" |
              Sort-Object FullName |
              ForEach-Object { $_.FullName }
          )
          python -m pytest -q @tests
      - name: B7-0 coverage ledger predecessor self-check
        shell: pwsh
        run: python -m sentinel.coverage_ledger --self-check
      - name: B7-1 Security Graph predecessor self-check
        shell: pwsh
        run: python -m sentinel.security_graph --self-check
      - name: B7-2 Incident Correlation predecessor self-check
        shell: pwsh
        run: python -m sentinel.incident_correlation --self-check
      - name: B7-3 Confidence Gate predecessor self-check
        shell: pwsh
        run: python -m sentinel.confidence_gate --self-check
      - name: B7-4 Attack-Chain Harness predecessor self-check
        shell: pwsh
        run: python -m sentinel.attack_chain_harness --self-check
      - name: B7-5 Explainable Security self-check
        shell: pwsh
        run: python -m sentinel.explainable_security --self-check
      - name: B7-5 safety and grounding assertions
        shell: pwsh
        run: |
          python -c "from sentinel.explainable_security import self_check; r=self_check(); assert r['passed']; assert r['all_positive_claims_evidence_bound']; assert r['user_explanation_present']; assert r['technical_explanation_present']; assert r['uncertainty_notes_present']; assert r['stable_round_trip']; assert r['deterministic_serialization']; assert r['source_graph_unchanged']; assert r['source_correlation_unchanged']; assert r['source_decision_unchanged']; assert r['authority_granted'] is False; assert r['confidence_amplified'] is False; assert r['unsupported_positive_claims_allowed'] is False; assert r['automatic_quarantine'] is False; assert r['automatic_repair'] is False; assert r['automatic_restore'] is False; assert r['general_home_execution_authorized'] is False"
