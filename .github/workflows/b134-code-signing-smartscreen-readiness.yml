name: B13-4 Code Signing SmartScreen Readiness

on:
  push:
    branches:
      - feature/v013-b134-code-signing-smartscreen-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering-signing-acceptance:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Beta13 B13-4 regression and Authenticode readiness acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V013-B134-CODE-SIGNING.ps1 -ConfirmCodeSigningReadiness
