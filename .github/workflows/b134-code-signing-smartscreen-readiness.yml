name: B13-4 Code Signing SmartScreen Readiness

on:
  push:
    branches:
      - feature/v013-b134-code-signing-smartscreen-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering-signing-acceptance:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Resolve pinned BuildTools package SHA256
        shell: powershell
        run: |
          $version = '10.0.28000.2705'
          $package = Join-Path $env:RUNNER_TEMP ('Microsoft.Windows.SDK.BuildTools.' + $version + '.nupkg')
          Invoke-WebRequest -UseBasicParsing -Uri ('https://www.nuget.org/api/v2/package/Microsoft.Windows.SDK.BuildTools/' + $version) -OutFile $package
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host ('B13-4 BUILDTOOLS_NUPKG_SHA256=' + $hash)
          throw 'B13-4 hash probe complete; pin this value before full acceptance.'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Beta13 B13-4 regression and Authenticode readiness acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V013-B134-CODE-SIGNING.ps1 -ConfirmCodeSigningReadiness
