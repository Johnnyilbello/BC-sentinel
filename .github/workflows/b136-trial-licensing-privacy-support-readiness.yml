name: B13-6 Trial Licensing Privacy Support Readiness

on:
  push:
    branches:
      - feature/v013-b136-trial-licensing-privacy-support-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commercial-readiness:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: B13-6 full regression and packaged commercial readiness acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V013-B136-COMMERCIAL-READINESS.ps1 -ConfirmCommercialReadiness
