name: B7-1 Security Graph Gate

on:
  push:
    branches:
      - feature/v011-beta7-b71-security-graph
  pull_request:
    paths:
      - 'sentinel/security_graph.py'
      - 'tests/test_v011_beta7_b71_security_graph.py'
      - 'TEST-V011-BETA7-B71.ps1'
      - 'BC_Sentinel_Roadmap_v0_11_0_Beta7.md'
      - 'BC_SENTINEL_V011_BETA7_B71_IMPLEMENTATION_STATUS.md'
      - '.github/workflows/b71-security-graph.yml'
  workflow_dispatch:

jobs:
  security-graph:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      BC_SENTINEL_REDUCED_MOTION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile B7-1
        shell: pwsh
        run: |
          python -m compileall -q sentinel/coverage_ledger.py sentinel/security_graph.py tests/test_v011_beta7_b70_coverage_ledger.py tests/test_v011_beta7_b71_security_graph.py
      - name: Beta5 + Beta6 + B7-0 predecessor regression and B7-1 tests
        shell: pwsh
        run: |
          $tests = @(
            Get-ChildItem -Path "tests/test_v011_beta5_*.py","tests/test_v011_beta6_*.py","tests/test_v011_beta7_b70_coverage_ledger.py","tests/test_v011_beta7_b71_security_graph.py" |
              Sort-Object FullName |
              ForEach-Object { $_.FullName }
          )
          python -m pytest -q @tests
      - name: B7-0 coverage ledger predecessor self-check
        shell: pwsh
        run: |
          python -m sentinel.coverage_ledger --self-check
      - name: B7-1 Security Graph self-check
        shell: pwsh
        run: |
          python -m sentinel.security_graph --self-check
      - name: B7-1 deterministic digest and authority assertions
        shell: pwsh
        run: |
          python -c "from sentinel.security_graph import self_check; a=self_check(); b=self_check(); assert a['passed']; assert a['stable_round_trip']; assert a['graph_digest']==b['graph_digest']; assert a['execution_authority_added'] is False; assert a['automatic_quarantine'] is False; assert a['automatic_repair'] is False; assert a['automatic_restore'] is False; assert a['general_home_execution_authorized'] is False; assert a['terminate_process_authorized'] is False; assert a['trust_allowlist_mutation_authorized'] is False"
