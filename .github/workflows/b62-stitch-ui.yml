name: B6-2 Stitch UI Gate

on:
  push:
    branches:
      - feature/v011-beta6-b62-home-security-overview
  pull_request:
    paths:
      - 'sentinel/home_security_ui.py'
      - 'sentinel/home_security_ui_impl.py'
      - 'sentinel/rescue_home_ui.py'
      - 'sentinel/ui_design_system.py'
      - 'sentinel/ui_styles.py'
      - 'sentinel/ui_pages.py'
      - 'tests/test_v011_beta6_b6*.py'
      - 'tools/v011_beta6_b62_acceptance.py'
  workflow_dispatch:

jobs:
  stitch-ui:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      BC_SENTINEL_REDUCED_MOTION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile migrated UI
        shell: pwsh
        run: |
          python -m compileall -q sentinel/home_security_model.py sentinel/ui_design_system.py sentinel/ui_styles.py sentinel/ui_pages.py sentinel/home_security_ui_impl.py sentinel/home_security_ui.py sentinel/rescue_home_ui.py tools/v011_beta6_b62_acceptance.py tests/test_v011_beta6_b61_home_real_ui_regressions.py tests/test_v011_beta6_b62_home_security_overview.py
      - name: Deterministic regression suite
        shell: pwsh
        run: |
          python -m pytest -q tests/test_v011_beta6_b60_technician_ux_foundation.py tests/test_v011_beta6_b61_unified_home_target_discovery.py tests/test_v011_beta6_b61_home_real_ui_regressions.py tests/test_v011_beta6_b62_home_security_overview.py
      - name: Stitch deterministic acceptance
        shell: pwsh
        run: python -m tools.v011_beta6_b62_acceptance --output acceptance-v011-beta6-b62-ci.json
      - name: Passive Home self-check
        shell: pwsh
        run: python -m sentinel.home_security_ui --self-check
      - name: Qt offscreen smoke
        shell: pwsh
        run: python -m sentinel.home_security_ui --offscreen-smoke
