name: B11-6 Upgrade Rollback Config Migration

on:
  push:
    branches:
      - feature/v011-beta11-b116-upgrade-rollback-config-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Full regression and B11-6 migration acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V011-BETA11-B116.ps1 -ConfirmUpgradeRollbackConfigMigration
