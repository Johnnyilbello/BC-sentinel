name: B10-4 Safe Response Plan Engine

on:
  push:
    branches:
      - feature/v011-beta10-b104-safe-response-plan-engine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Full regression and B10-4 Safe Response acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V011-BETA10-B104.ps1 -ConfirmSafeResponsePlan
