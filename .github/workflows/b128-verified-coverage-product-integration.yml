name: B12-8 Verified Coverage Product Integration

on:
  push:
    branches:
      - feature/v012-beta12-b128-verified-coverage-product-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Beta12 B12-8 full regression and product integration acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V012-BETA12-B128.ps1 -ConfirmProductIntegration
