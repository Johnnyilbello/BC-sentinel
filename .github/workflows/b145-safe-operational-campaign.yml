name: B14-5 Safe Operational Campaign

on:
  push:
    branches:
      - feature/v014-b145-safe-operational-campaign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-operational-campaign:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: B14-5 full regression and safe operational campaign acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V014-B145-SAFE-OPERATIONAL-CAMPAIGN.ps1 -ConfirmSafeOperationalCampaign
