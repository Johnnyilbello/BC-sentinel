name: B10-7 Live Coverage Expansion II + Operational Impact

on:
  push:
    branches:
      - feature/v011-beta10-b107-live-coverage-expansion-ii
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Full regression and B10-7 operational impact acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V011-BETA10-B107.ps1 -ConfirmOperationalImpactAcceptance
