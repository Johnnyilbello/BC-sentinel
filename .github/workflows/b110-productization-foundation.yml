name: B11-0 Windows Productization Foundation

on:
  push:
    branches:
      - feature/v011-beta11-b110-productization-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Full regression and B11-0 productization acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V011-BETA11-B110.ps1 -ConfirmProductizationFoundation
