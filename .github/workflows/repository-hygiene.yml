name: Beta8 Repository Hygiene Gate

on:
  push:
    branches:
      - chore/v011-beta8-repository-hygiene
  pull_request:
    paths:
      - 'BUILD-V011-BETA6-B67-PORTABLE-GUI.ps1'
      - 'README.md'
      - 'ROADMAP.md'
      - 'tools/acceptance/TEST-V011-BETA8-REPOSITORY-HYGIENE.ps1'
      - '.github/workflows/repository-hygiene.yml'
  workflow_dispatch:

jobs:
  repository-hygiene:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      BC_SENTINEL_REDUCED_MOTION: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify frozen B8-0 lineage and unchanged engineering paths
        shell: pwsh
        run: |
          $accepted = '969781bd7633d0b2bc92840e8f12220f00de4279'
          git cat-file -e "$accepted^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Frozen B8-0 predecessor unavailable' }
          git merge-base --is-ancestor $accepted HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Hygiene branch is not based on frozen B8-0' }
          foreach ($path in @('coverage','packaging','sentinel','tests')) {
            git diff --quiet $accepted HEAD -- $path
            if ($LASTEXITCODE -ne 0) { throw "Accepted B8-0 engineering path changed during hygiene: $path" }
          }

      - name: Verify compact repository root and single roadmap
        shell: pwsh
        run: |
          $allowed = @(
            'BUILD-V011-BETA6-B67-PORTABLE-GUI.ps1',
            'README.md',
            'ROADMAP.md',
            'SECURITY.md',
            'STABLE-RELEASE.md',
            'STABLE_VERSION.json',
            'START-BC-SENTINEL-STABLE.bat',
            'START-BC-SENTINEL-STABLE.ps1',
            'pyproject.toml',
            'requirements.txt'
          )
          $root = @(git ls-files | Where-Object { $_ -notmatch '/' } | Sort-Object)
          $unexpected = @($root | Where-Object { $_ -notin $allowed })
          $missing = @($allowed | Where-Object { $_ -notin $root })
          if ($unexpected.Count -gt 0) { throw "Unexpected root files: $($unexpected -join ', ')" }
          if ($missing.Count -gt 0) { throw "Missing root files: $($missing -join ', ')" }
          $roadmaps = @(git ls-files | Where-Object { $_ -match '(?i)roadmap' })
          if ($roadmaps.Count -ne 1 -or $roadmaps[0] -ne 'ROADMAP.md') {
            throw "ROADMAP.md must be the only roadmap file. Found: $($roadmaps -join ', ')"
          }

      - name: Compile accepted source
        shell: pwsh
        run: python -m compileall -q sentinel

      - name: Beta5 Beta6 Beta7 and B8-0 regression
        shell: pwsh
        run: |
          $tests = @(
            Get-ChildItem -Path 'tests/test_v011_beta5_*.py','tests/test_v011_beta6_*.py','tests/test_v011_beta7_*.py','tests/test_v011_beta8_b80_coverage_baseline.py' |
              Sort-Object FullName |
              ForEach-Object { $_.FullName }
          )
          python -m pytest -q @tests

      - name: Frozen intelligence self-checks
        shell: pwsh
        run: |
          python -m sentinel.beta7_final_acceptance --self-check
          python -m sentinel.beta8_coverage_baseline --self-check
          python -c "from sentinel.beta8_coverage_baseline import self_check; r=self_check(); assert r['passed']; assert r['summary']=={'PARTIAL':3,'GAP':3,'VERIFIED':0}; assert r['authority_granted'] is False; assert r['automatic_quarantine'] is False; assert r['automatic_repair'] is False; assert r['automatic_restore'] is False; assert r['delete_authorized'] is False; assert r['repair_authorized'] is False; assert r['terminate_process_authorized'] is False; assert r['trust_allowlist_mutation_authorized'] is False; assert r['privileged_system_mutation_authorized'] is False"
