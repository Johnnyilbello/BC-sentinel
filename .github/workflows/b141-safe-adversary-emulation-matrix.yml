name: B14-1 Safe Adversary Emulation Matrix

on:
  push:
    branches:
      - feature/v014-b141-safe-adversary-emulation-matrix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-adversary-matrix:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: B14-1 full regression and safe adversary matrix acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V014-B141-SAFE-ADVERSARY-MATRIX.ps1 -ConfirmSafeAdversaryMatrix
