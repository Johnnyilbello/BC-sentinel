name: B11-4 First-Run Health Repair Guidance

on:
  push:
    branches:
      - feature/v011-beta11-b114-first-run-health-repair-guidance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Full regression and B11-4 health acceptance
        shell: powershell
        run: ./tools/acceptance/TEST-V011-BETA11-B114.ps1 -ConfirmFirstRunHealthRepairGuidance
